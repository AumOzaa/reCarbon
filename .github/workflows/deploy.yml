name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:


env:
  IMAGE_NAME: prathamalwayscomeslast/recarbon-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────────────
      # 2. Login to Docker Hub
      # ─────────────────────────────────────

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ─────────────────────────────────────
      # 3. Set up Docker Buildx
      # ─────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ─────────────────────────────────────
      # 4. Build + Push Docker image
      # ─────────────────────────────────────

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # prepare ssh key
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/recarbon-ec2"

          chmod 600 "$RUNNER_TEMP/recarbon-ec2"

          ssh-keygen -lf <(
            ssh-keygen -y -f "$RUNNER_TEMP/recarbon-ec2"
          ) -E sha256

          echo "SSH key prepared."

      # ─────────────────────────────────────
      # 5. Wait for EC2 + create .env
      # ─────────────────────────────────────

      - name: Configure EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          KEY_FILE="$RUNNER_TEMP/recarbon-ec2"

          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "Testing SSH connection..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo 'SSH connection successful'"

          echo "Creating application directory..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo mkdir -p /opt/recarbon"

          echo "Writing production .env..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo tee /opt/recarbon/.env > /dev/null" <<EOF
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}

          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}

          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_CLOUD_URL=${{ secrets.OLLAMA_CLOUD_URL }}

          LLM_MODEL=${{ secrets.LLM_MODEL }}
          FEED_FRESHNESS_DECAY_DAYS=${{ secrets.FEED_FRESHNESS_DECAY_DAYS }}
          EOF

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo chmod 600 /opt/recarbon/.env && sudo chown root:root /opt/recarbon/.env"

          echo "EC2 configured."
      

      # ─────────────────────────────────────
      # 6. Deploy
      # ─────────────────────────────────────

      - name: Deploy to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          KEY_FILE="$RUNNER_TEMP/recarbon-ec2"

          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "Connecting to $EC2_USERNAME@$EC2_HOST"

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo SSH_OK"

          IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Pulling image: $IMAGE"

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker pull '$IMAGE'"

          echo "Stopping old container..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker stop recarbon-backend || true"

          echo "Removing old container..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker rm recarbon-backend || true"

          echo "Starting new container..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker run -d \
              --name recarbon-backend \
              --restart unless-stopped \
              --env-file /opt/recarbon/.env \
              -p 3000:3000 \
              '$IMAGE'"

          echo "Waiting for container..."
          sleep 5

          echo "Checking container..."

          ssh \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker ps --filter name=recarbon-backend"

          echo "Deployment successful!"