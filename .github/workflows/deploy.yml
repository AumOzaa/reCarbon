name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: prathamalwayscomeslast/recarbon-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────────────
      # 2. Login to Docker Hub
      # ─────────────────────────────────────

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ─────────────────────────────────────
      # 3. Set up Docker Buildx
      # ─────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ─────────────────────────────────────
      # 4. Build + Push Docker image
      # ─────────────────────────────────────

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ─────────────────────────────────────
      # 5. Wait for EC2 + create .env
      # ─────────────────────────────────────

      - name: Configure EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
            
            echo "Waiting for Docker..."
            
            for i in {1..30}; do
              if sudo systemctl is-active --quiet docker; then
                echo "Docker is ready."
                break
              fi
            
              echo "Docker not ready yet..."
              sleep 5
            done
            
            if ! sudo systemctl is-active --quiet docker; then
              echo "Docker failed to start."
              exit 1
            fi
            
            
            echo "Creating application directory..."
            
            sudo mkdir -p /opt/recarbon
            
            
            echo "Writing production .env..."
            
            sudo tee /opt/recarbon/.env > /dev/null <<'EOF'
            NODE_ENV=${{ secrets.NODE_ENV }}
            PORT=${{ secrets.PORT }}
            
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
            
            OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
            OLLAMA_CLOUD_URL=${{ secrets.OLLAMA_CLOUD_URL }}
            
            LLM_MODEL=${{ secrets.LLM_MODEL }}
            FEED_FRESHNESS_DECAY_DAYS=${{ secrets.FEED_FRESHNESS_DECAY_DAYS }}
            EOF
            
            sudo chmod 600 /opt/recarbon/.env
            sudo chown root:root /opt/recarbon/.env
      

      # ─────────────────────────────────────
      # 6. Deploy
      # ─────────────────────────────────────

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
            
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            
            echo "Pulling image: $IMAGE"
            
            docker pull "$IMAGE"
            
            
            echo "Stopping old container..."
            
            docker stop recarbon-backend || true
            
            
            echo "Removing old container..."
            
            docker rm recarbon-backend || true
            
            
            echo "Starting new container..."
            
            docker run -d \
              --name recarbon-backend \
              --restart unless-stopped \
              --env-file /opt/recarbon/.env \
              -p 3000:3000 \
              "$IMAGE"
            
            
            echo "Waiting for container..."
            
            sleep 5
            
            
            echo "Checking container status..."
            
            if ! docker ps --filter "name=recarbon-backend" --filter "status=running" | grep -q recarbon-backend; then
              echo "Container failed to start."
            
              docker logs recarbon-backend || true
            
              exit 1
            fi
            
            
            echo "Removing unused images..."
            
            docker image prune -af
            
            
            echo "Deployment successful!"
            
            docker ps
