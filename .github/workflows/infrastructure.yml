name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # AWS credentials
      # ─────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ─────────────────────────────────────
      # Terraform
      # ─────────────────────────────────────

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ─────────────────────────────────────
      # Generate terraform.tfvars
      # ─────────────────────────────────────

      - name: Create terraform.tfvars
        working-directory: infra/terraform
        env:
          TF_SSH_PUBLIC_KEY: ${{ secrets.TF_SSH_PUBLIC_KEY }}
          TF_ALLOWED_SSH_CIDR: ${{ secrets.TF_ALLOWED_SSH_CIDR }}
          TF_AWS_REGION: ${{ vars.AWS_REGION }}
          TF_INSTANCE_TYPE: ${{ vars.TF_INSTANCE_TYPE }}
          TF_INSTANCE_NAME: ${{ vars.TF_INSTANCE_NAME }}
          TF_SSH_KEY_NAME: ${{ vars.TF_SSH_KEY_NAME }}
          TF_APP_PORT: ${{ vars.TF_APP_PORT }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${TF_AWS_REGION}"
          environment = "production"
          
          instance_type = "${TF_INSTANCE_TYPE}"
          instance_name = "${TF_INSTANCE_NAME}"
          
          ssh_key_name = "${TF_SSH_KEY_NAME}"
          ssh_public_key = "${TF_SSH_PUBLIC_KEY}"
          
          allowed_ssh_cidr = "${TF_ALLOWED_SSH_CIDR}"
          
          app_port = ${TF_APP_PORT}
          EOF

      # ─────────────────────────────────────
      # Terraform init
      # ─────────────────────────────────────

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      # ─────────────────────────────────────
      # Terraform Plan
      # ─────────────────────────────────────

      - name: Terraform Plan
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform plan -input=false

      # ─────────────────────────────────────
      # Terraform Apply
      # ─────────────────────────────────────

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false

      # ─────────────────────────────────────
      # Terraform Destroy
      # ─────────────────────────────────────

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: infra/terraform
        run: terraform destroy -auto-approve -input=false

      # ─────────────────────────────────────
      # Cleanup
      # ─────────────────────────────────────
      - name: Remove generated tfvars
        if: always()
        working-directory: infra/terraform
        run: rm -f terraform.tfvars

      - name: Get EC2 Public IP
        if: inputs.action == 'apply'
        id: ec2_ip
        working-directory: infra/terraform
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Update Vercel API URL
        if: inputs.action == 'apply'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EC2_IP: ${{ steps.ec2_ip.outputs.public_ip }}
        run: |
          set -e
          
          API_URL="http://${EC2_IP}:3000"
          
          echo "Setting NEXT_PUBLIC_API_URL=${API_URL}"
          
          ENV_ID=$(curl -sS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            | jq -r '.envs[] | select(.key=="NEXT_PUBLIC_API_URL" and (.target | index("production"))) | .id' \
            | head -n 1)
          
          if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "null" ]; then
            echo "Updating existing environment variable..."
          
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${ENV_ID}?teamId=${VERCEL_ORG_ID}" \
              -d "{\"value\":\"${API_URL}\",\"target\":[\"production\"]}"
          else
            echo "Creating environment variable..."
          
            curl -sS -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -d "{\"key\":\"NEXT_PUBLIC_API_URL\",\"value\":\"${API_URL}\",\"type\":\"plain\",\"target\":[\"production\"]}"
          fi

      - name: Redeploy Existing Vercel Git Deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          
          echo "Finding latest production deployment..."
          
          DEPLOYMENT=$(curl -sS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=10" \
            | jq -c '
              .deployments
              | map(select(.state == "READY" and .target == "production"))
              | .[0]
            ')
          
          echo "$DEPLOYMENT" | jq .
          
          DEPLOYMENT_ID=$(echo "$DEPLOYMENT" | jq -r '.uid // empty')
          GIT_SHA=$(echo "$DEPLOYMENT" | jq -r '.meta.githubCommitSha // empty')
          GIT_REPO=$(echo "$DEPLOYMENT" | jq -r '.meta.githubRepo // empty')
          
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Could not find a production deployment."
            exit 1
          fi
          
          if [ -z "$GIT_SHA" ]; then
            echo "Could not find Git commit SHA for the production deployment."
            exit 1
          fi
          
          if [ -z "$GIT_REPO" ]; then
            echo "Could not find GitHub repository for the production deployment."
            exit 1
          fi
          
          REPO_ID=$(curl -sS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            | jq -r '.link.repoId // empty')
          
          if [ -z "$REPO_ID" ]; then
            echo "Could not determine the GitHub repository ID from the Vercel project."
            exit 1
          fi
          
          echo "Production deployment: ${DEPLOYMENT_ID}"
          echo "Git SHA: ${GIT_SHA}"
          echo "GitHub repo: ${GIT_REPO}"
          echo "GitHub repo ID: ${REPO_ID}"
          
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -d "{
              \"name\": \"hackout26-frontend\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repoId\": \"${REPO_ID}\",
                \"ref\": \"master\",
                \"sha\": \"${GIT_SHA}\"
              },
              \"target\": \"production\"
            }")
          
          echo "$RESPONSE" | jq .
          
          DEPLOYMENT_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to create Vercel Git deployment."
            exit 1
          fi
          
          echo "Vercel deployment started: https://${DEPLOYMENT_URL}"