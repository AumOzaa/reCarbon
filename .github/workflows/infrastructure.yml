name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # AWS credentials
      # ─────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ─────────────────────────────────────
      # Terraform
      # ─────────────────────────────────────

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ─────────────────────────────────────
      # Generate terraform.tfvars
      # ─────────────────────────────────────

      - name: Create terraform.tfvars
        working-directory: infra/terraform
        env:
          TF_SSH_PUBLIC_KEY: ${{ secrets.TF_SSH_PUBLIC_KEY }}
          TF_ALLOWED_SSH_CIDR: ${{ secrets.TF_ALLOWED_SSH_CIDR }}
          TF_AWS_REGION: ${{ vars.AWS_REGION }}
          TF_INSTANCE_TYPE: ${{ vars.TF_INSTANCE_TYPE }}
          TF_INSTANCE_NAME: ${{ vars.TF_INSTANCE_NAME }}
          TF_SSH_KEY_NAME: ${{ vars.TF_SSH_KEY_NAME }}
          TF_APP_PORT: ${{ vars.TF_APP_PORT }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${TF_AWS_REGION}"
          environment = "production"
          
          instance_type = "${TF_INSTANCE_TYPE}"
          instance_name = "${TF_INSTANCE_NAME}"
          
          ssh_key_name = "${TF_SSH_KEY_NAME}"
          ssh_public_key = "${TF_SSH_PUBLIC_KEY}"
          
          allowed_ssh_cidr = "${TF_ALLOWED_SSH_CIDR}"
          
          app_port = ${TF_APP_PORT}
          EOF

      # ─────────────────────────────────────
      # Terraform init
      # ─────────────────────────────────────

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      # ─────────────────────────────────────
      # Terraform Plan
      # ─────────────────────────────────────

      - name: Terraform Plan
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform plan -input=false

      # ─────────────────────────────────────
      # Terraform Apply
      # ─────────────────────────────────────

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false

      # ─────────────────────────────────────
      # Terraform Destroy
      # ─────────────────────────────────────

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: infra/terraform
        run: terraform destroy -auto-approve -input=false

      # ─────────────────────────────────────
      # Cleanup
      # ─────────────────────────────────────
      - name: Remove generated tfvars
        if: always()
        working-directory: infra/terraform
        run: rm -f terraform.tfvars

      - name: Get EC2 Public IP
        if: inputs.action == 'apply'
        id: ec2_ip
        working-directory: infra/terraform
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Update DuckDNS
        env:
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          EC2_IP: ${{ steps.ec2_ip.outputs.public_ip }}
        run: |
          set -e
          RESPONSE=$(curl -fsS "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${EC2_IP}&verbose=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "^OK"
          
      - name: Wait for DuckDNS
        env:
          EC2_IP: ${{ steps.ec2_ip.outputs.public_ip }}
        run: |
          set -e
          for i in {1..30}; do
            RESOLVED_IP=$(getent ahostsv4 recarbon-api.duckdns.org | awk 'NR==1 {print $1}')
            echo "DNS: $RESOLVED_IP | EC2: $EC2_IP"
            if [ "$RESOLVED_IP" = "$EC2_IP" ]; then
              echo "DNS is ready."
              exit 0
            fi
            sleep 10
          done
          echo "DNS did not update."
          exit 1

      - name: Configure HTTPS on EC2
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["nginx -t","systemctl restart nginx","certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d recarbon-api.duckdns.org --redirect","systemctl enable certbot.timer","systemctl start certbot.timer"]' \
            --query "Command.CommandId" \
            --output text)

          echo "HTTPS setup command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "HTTPS configured successfully."
